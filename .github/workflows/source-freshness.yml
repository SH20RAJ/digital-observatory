name: Source Freshness

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report configured source strategy
        shell: bash
        run: |
          set -euo pipefail
          echo "Digital Observatory source registry:"
          grep -E '^\| [A-Za-z].*\|' docs/DATA-SOURCES.md || true
          echo "This workflow is intentionally a foundation placeholder."
          echo "Production collectors will be added with source-specific credentials, limits, and tests."
