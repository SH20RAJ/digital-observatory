name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Validate content & frontmatter
        run: npm run content:check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate artifacts
        run: npm run generate:artifacts

      - name: Run automated test suite
        run: npm test

      - name: Build static export & generate artifacts
        run: npm run build

      - name: Verify generated artifact integrity
        run: npm run verify:artifacts
