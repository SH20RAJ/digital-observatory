name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_SITE_URL: "https://observatory.campusloop.space"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Validate content
        run: npm run content:check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate artifacts
        run: npm run generate:artifacts

      - name: Run automated test suite
        run: npm test

      - name: Build static export & generate artifacts
        run: npm run build

      - name: Verify artifact integrity
        run: npm run verify:artifacts

      - name: Add .nojekyll and CNAME
        run: |
          touch out/.nojekyll
          echo "observatory.campusloop.space" > out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
