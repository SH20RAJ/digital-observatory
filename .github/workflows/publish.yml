name: Publish Observatory

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatory-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Validate content & frontmatter
        run: npm run content:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Build static export & generate artifacts
        run: npm run build

      - name: Verify generated artifact integrity
        run: npm run verify:artifacts

      - name: Deploy to Vercel when configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Archive build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-observatory-build-${{ github.run_number }}
          path: |
            .next
            public
            content/posts
          retention-days: 7
