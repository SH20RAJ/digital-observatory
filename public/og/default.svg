    <stop offset="0%" stop-color="#080c14"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>
  <radialGradient id="glowGrad" cx="80%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
