<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080c14"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>
  <radialGradient id="glowGrad" cx="80%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
    <stop offset="50%" stop-color="#0284c7" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Background & Glow -->
<rect width="1200" height="630" fill="url(#bgGrad)"/>
<rect width="1200" height="630" fill="url(#glowGrad)"/>

<!-- Outer Bezel -->
<rect x="1.5" y="1.5" width="1197" height="627" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

<!-- Right Telemetry Graphic -->
<g opacity="0.95">
  <line x1="770" y1="285" x2="1170" y2="285" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
  <line x1="970" y1="85" x2="970" y2="485" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
  <line x1="828" y1="143" x2="1112" y2="427" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 6" opacity="0.04"/>
  <line x1="828" y1="427" x2="1112" y2="143" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 6" opacity="0.04"/>

  <circle cx="970" cy="285" r="185" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.18"/>
  <circle cx="970" cy="285" r="130" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.28"/>
  <circle cx="970" cy="285" r="75" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.38"/>

  <circle cx="1100" cy="285" r="5.5" fill="#818cf8" opacity="0.85"/>
  <circle cx="840" cy="285" r="5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="970" cy="155" r="5" fill="#38bdf8" opacity="0.75"/>
  <circle cx="970" cy="415" r="5.5" fill="#818cf8" opacity="0.8"/>

  <path d="M 830 205 A 165 165 0 0 1 1085 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 855 365 A 165 165 0 0 0 1085 390" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</g>

<!-- Top Brand Bar -->
<g transform="translate(80, 75)">
  <rect width="36" height="36" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="18" cy="18" r="9" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="18" cy="18" r="3.5" fill="#38bdf8"/>
  <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="0.08em" fill="#f1f5f9">DIGITAL OBSERVATORY</text>
  <text x="260" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="500" letter-spacing="0.05em" fill="#64748b">/ OPEN RESEARCH</text>
</g>

<!-- Category Pill -->
<g transform="translate(80, 130)">
  <rect width="363.5" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="14" cy="14" r="3.5" fill="#38bdf8"/>
  <text x="26" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#38bdf8">OPEN RESEARCH JOURNAL OBSERVATION</text>
</g>

<!-- Title & Description -->
<text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="50" font-weight="800" letter-spacing="-0.03em" fill="#f8fafc">Signals Worth</text>
<text x="80" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="50" font-weight="800" letter-spacing="-0.03em" fill="#f8fafc">Understanding.</text>
<text x="80" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">An open-source digital observatory tracking public</text>
<text x="80" y="391" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">signals across AI, open source, developers, startups,</text>
<text x="80" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">internet infrastructure, security, and digital…</text>

<!-- Footer Telemetry Strip -->
<g transform="translate(80, 560)">
  <line x1="0" y1="-20" x2="1040" y2="-20" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#64748b">DATE</text>
  <text x="50" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Live observatory</text>

  <text x="210" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#64748b">READ</text>
  <text x="260" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">50+ observations</text>

  <text x="420" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#64748b">PROVENANCE</text>
  <text x="525" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#38bdf8">Source-backed / Git-verified</text>

  <text x="1040" y="5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="500" fill="#475569">observatory.campusloop.space</text>
</g>

</svg>